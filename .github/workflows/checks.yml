name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Tests, snapshot validation and site check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out ETSA
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run all checks
        run: npm run check
