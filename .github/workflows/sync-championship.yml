name: Publish verified venue gallery

on:
  push:
    branches:
      - agent/ethiopian-esport-venue-gallery

permissions:
  contents: write

concurrency:
  group: etsa-venue-gallery-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Fast-forward verified venue gallery
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish only the verified venue commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          expected="4ab9719bc80a4ea41433cfe0c63cce4cbbbab7ff"

          if [[ "$current" != "$expected" ]]; then
            echo "Main moved from the verified base; refusing publication."
            exit 1
          fi

          git push origin b82c2ec720a35b5a6af02515bfd2551a769be115:refs/heads/main
