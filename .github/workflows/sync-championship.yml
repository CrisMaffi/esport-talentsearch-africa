name: Sync live championship

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      championship_id:
        description: "Optional championship ID; leave blank to update all public championships"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: etsa-championship-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Validate and update championship data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHAMPIONSHIP_ID: ${{ inputs.championship_id }}

    steps:
      - name: Check out ETSA
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Capture raw source (diagnostic)
        run: node diag/capture.mjs

      - name: Run sync (diagnostic)
        run: |
          set +e
          for id in 1 2; do CHAMPIONSHIP_ID=$id npm run championship:sync > diag/sync-$id.log 2>&1; echo "exit $?" >> diag/sync-$id.log; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -m "diag: capture" && git push
          exit 0

      - name: Stop (diagnostic)
        run: exit 0

      - name: Fetch and validate official championship data
        if: false
        run: npm run championship:sync

      - name: Validate generated snapshot
        if: false
        run: npm run championship:validate

      - name: Commit only verified data changes
        if: false
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/*.json)" ]]; then
            echo "No championship data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "chore: sync championship data"
          git push
