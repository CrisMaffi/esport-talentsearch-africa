<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esport Talent Search Africa – Work in Progress</title>

    <style>
        /* Base layout */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            text-align: center;
            overflow-x: hidden;
        }

        /* Fade-in animation */
        .fade-in {
            opacity: 0;
            animation: fadeIn 1.2s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top-left ETSA label */
        .navbar {
            width: 100%;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            background: #ffffffcc;
            backdrop-filter: blur(6px);
            position: fixed;
            top: 0;
            z-index: 50;
        }

        .navbar-title {
            font-size: 22px;
            font-weight: bold;
        }

        /* Africa background */
        .background-map {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 95%;
            max-width: 1100px;
            opacity: 0.22;
            filter: brightness(0.4);
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Content wrapper */
        .content {
            margin-top: 120px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* Logo row */
        .logo-row {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .logo-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Individual logo sizes */
        .logo-fia { height: 75px; width: auto; object-fit: contain; }
        .logo-maffi { height: 85px; width: auto; object-fit: contain; }
        .logo-emsa { height: 80px; width: auto; object-fit: contain; }

        .fia-text {
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Typography */
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            opacity: 0.85;
        }

        /* Footer bar */
        footer {
            margin-top: 60px;
            padding: 20px;
            background: #000;
            color: #fff;
            font-size: 14px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .logo-fia { height: 60px; }
            .logo-maffi { height: 70px; }
            .logo-emsa { height: 65px; }
            .background-map { width: 130%; opacity: 0.25; }
        }

        @media (max-width: 480px) {
            .logo-fia { height: 50px; }
            .logo-maffi { height: 60px; }
            .logo-emsa { height: 55px; }
            .background-map { width: 160%; opacity: 0.28; }
        }
    </style>
</head>

<body>

    <!-- Top-left ETSA label -->
    <div class="navbar fade-in">
        <div class="navbar-title">ETSA</div>
    </div>

    <!-- Background Africa Map -->
    <img src="africa-map.png" alt="Africa Map Background" class="background-map">

    <div class="content fade-in">

        <div class="logo-row">
            <div class="logo-block">
                <img src="fia-logo.png" alt="FIA Logo" class="logo-fia">
                <div class="fia-text">Member of</div>
            </div>

            <div class="logo-block">
                <img src="maffi-esports-logo.png" alt="Maffi Esports Logo" class="logo-maffi">
            </div>

            <div class="logo-block">
                <img src="emsa-logo.png" alt="EMSA Logo" class="logo-emsa">
            </div>
        </div>

        <h1 class="fade-in">Official Platform Under Construction</h1>
        <p class="fade-in">The African Esports & Motorsport Talent Pathway is being built.</p>

    </div>

    <!-- Footer Bar -->
    <footer>
        © Maffi Racing — Contact: c.maffi@maffiracing.com
    </footer>

</body>
</html>
