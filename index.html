<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esport Talent Search Africa – Work in Progress</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Background Africa Map */
        .background-map {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90%;
            max-width: 900px;
            opacity: 0.08;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        .logo-row {
            display: flex;
            gap: 50px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .logo-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-block img {
            max-height: 80px;
            margin-bottom: 8px;
        }

        .fia-text {
            font-size: 14px;
            font-weight: bold;
            margin-top: -5px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            opacity: 0.85;
        }

        footer {
            margin-top: 60px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- Background Africa Map -->
    <img src="africa-map.png" alt="Africa Map Background" class="background-map">

    <div class="content">

        <div class="logo-row">
            <div class="logo-block">
                <img src="fia-logo.png" alt="FIA Logo">
                <div class="fia-text">Member of FIA</div>
            </div>

            <div class="logo-block">
                <img src="maffi-esports-logo.png" alt="Maffi Esports Logo">
            </div>

            <div class="logo-block">
                <img src="emsa-logo.png" alt="EMSA Logo">
            </div>
        </div>

        <h1>Official Platform Under Construction</h1>
        <p>The African Esports & Motorsport Talent Pathway is being built.</p>

        <footer>
            © Maffi Racing — Contact: c.maffi@maffiracing.com
        </footer>

    </div>

</body>
</html>
