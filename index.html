<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esport Talent Search Africa – Work in Progress</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;
        }

        /* Fade-in animation */
        .fade-in {
            opacity: 0;
            animation: fadeIn 1.2s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ETSA top-left */
        .navbar {
            width: 100%;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            background: #ffffffcc;
            backdrop-filter: blur(6px);
            position: fixed;
            top: 0;
            z-index: 50;
        }

        .navbar-title {
            font-size: 22px;
            font-weight: bold;
        }

        /* Africa map container with ratio protection */
        .africa-wrapper {
            position: relative;
            width: 90%;
            max-width: 900px;
            margin: 140px auto 0 auto;
        }

        .africa-map {
            width: 100%;
            height: auto;          /* maintains perfect ratio */
            display: block;
            opacity: 0.22;
            filter: brightness(0.4);
        }

        /* Centered content inside Africa map */
        .center-content {
            position: absolute;
            top: 50%;               /* always centered vertically */
            left: 50%;              /* always centered horizontally */
            transform: translate(-50%, -50%);
            width: 80%;             /* scales with Africa map */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Logos scale proportionally */
        .logo-row {
            display: flex;
            gap: 4vw;               /* responsive spacing */
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2vw;
        }

        .logo-fia { height: 8vw; max-height: 75px; width: auto; }
        .logo-maffi { height: 9vw; max-height: 85px; width: auto; }
        .logo-emsa { height: 8.5vw; max-height: 80px; width: auto; }

        .fia-text {
            font-size: 1.4vw;
            min-font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Text under logos */
        h1 {
            font-size: 3vw;
            max-font-size: 32px;
            margin: 10px 0 5px 0;
        }

        p {
            font-size: 2vw;
            max-font-size: 18px;
            opacity: 0.85;
        }

        /* Powered by */
        .powered-by {
            margin-top: 40px;
            font-size: 16px;
            font-weight: bold;
            opacity: 0.8;
            text-align: center;
        }

        /* Footer */
        footer {
            margin-top: 20px;
            padding: 20px;
            font-size: 14px;
            color: #000;
            text-align: center;
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .logo-fia { height: 14vw; }
            .logo-maffi { height: 16vw; }
            .logo-emsa { height: 15vw; }

            h1 { font-size: 6vw; }
            p { font-size: 4vw; }
            .fia-text { font-size: 3.5vw; }
        }
    </style>
</head>

<body>

    <!-- ETSA top-left -->
    <div class="navbar fade-in">
        <div class="navbar-title">ETSA</div>
    </div>

    <!-- Africa map with centered content -->
    <div class="africa-wrapper fade-in">
        <img src="africa-map.png" alt="Africa Map" class="africa-map">

        <div class="center-content">

            <div class="logo-row">
                <div class="logo-block">
                    <img src="fia-logo.png" alt="FIA Logo" class="logo-fia">
                    <div class="fia-text">Member of</div>
                </div>

                <div class="logo-block">
                    <img src="maffi-esports-logo.png" alt="Maffi Esports Logo" class="logo-maffi">
                </div>

                <div class="logo-block">
                    <img src="emsa-logo.png" alt="EMSA Logo" class="logo-emsa">
                </div>
            </div>

            <h1>Official Platform Under Construction</h1>
            <p>The African Esports Talent Pathway is being built.</p>

        </div>
    </div>

    <!-- Powered by -->
    <div class="powered-by fade-in">
        Powered by Maffi Racing
    </div>

    <!-- Footer -->
    <footer>
        © Maffi Racing — Contact: c.maffi@maffiracing.com
    </footer>

</body>
</html>
